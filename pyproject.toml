[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-insights-sql"
version = "0.1.0"
description = "Analyze a retail sales dataset using SQL (SQLite) for aggregation and Python for visualization."
requires-python = ">=3.10"
dependencies = [
    "pandas==3.0.5",
    "matplotlib==3.11.1",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["create_db", "analyze_sales", "utils"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
